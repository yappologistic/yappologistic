name: Refresh profile

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?color_snake=#f2f2f2&color_dots=#1c1c1c,#3a3a3a,#676767,#b4b4b4,#e0525b
            dist/snake-light.svg?color_snake=#0b0b0b&color_dots=#f3f3f3,#d4d4d4,#949494,#585858,#c9302d

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Project and stats cards
        run: |
          pip install --quiet fonttools brotli pillow
          python scripts/refresh.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
          DIST: dist

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
